# Same OIDC trusted-publish workflow pattern as @ibobbyts/svelte-ui-utils.
# First npm publication is manual; subsequent versions publish on matching tags.
name: npm publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify and test source
        run: npm run check
      - name: Verify release tag is the package version on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match v${version}" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo 'Tagged commit is not on main' >&2
            exit 1
          }
      - name: Validate packed contents (manual dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm pack --dry-run --ignore-scripts
      - name: Publish to npm using OIDC
        if: github.event_name == 'push'
        run: npm publish --access public
